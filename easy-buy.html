<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>خرید آسان | کریپتوکارنسی</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%238B5CF6'/%3E%3Cstop offset='50%25' stop-color='%2300D4FF'/%3E%3Cstop offset='100%25' stop-color='%23D4AF37'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='%230B0E11'/%3E%3Cpath d='M75 25 A30 30 0 1 0 75 75' fill='none' stroke='url(%23g)' stroke-width='12' stroke-linecap='round'/%3E%3Cpath d='M70 20 L90 10 L80 35 Z' fill='%2300D4FF'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="header">
  <a href="index.html" class="logo"><svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#D4AF37"/></linearGradient></defs><path d="M75 25 A30 30 0 1 0 75 75" fill="none" stroke="url(#lg)" stroke-width="12" stroke-linecap="round"/><path d="M70 20 L90 10 L80 35 Z" fill="#00D4FF"/></svg>کریپتوکارنسی</a>
  <nav class="nav"><a href="index.html">بازار</a><a href="trade.html">معامله</a><a href="easy-buy.html" class="active">خرید آسان</a><a href="markets.html">بازارها</a></nav>
  <div class="header-actions" id="authB"><button class="btn btn-outline btn-sm" onclick="openM('loginM')">ورود</button><button class="btn btn-primary btn-sm" onclick="openM('regM')">ثبت‌نام</button></div>
  <div class="header-actions" id="userI" style="display:none"><span style="color:var(--primary);font-weight:600" id="un"></span><button class="btn btn-outline btn-sm" onclick="logout()">خروج</button></div>
</header>
<div class="container" style="max-width:520px;padding-top:28px">
  <h1 class="page-title" style="text-align:center">خرید آسان</h1>
  <p class="page-sub" style="text-align:center">خرید با کارت بانکی</p>
  <div class="card">
    <div class="form-group"><label>رمزارز</label>
      <select class="form-control" id="ebCoin" onchange="ebCalc()">
        <option value="6840000000" data-s="BTC">Bitcoin (BTC)</option>
        <option value="185200000" data-s="ETH">Ethereum (ETH)</option>
        <option value="12400000" data-s="SOL">Solana (SOL)</option>
        <option value="68450" data-s="USDT">Tether (USDT)</option>
        <option value="12850" data-s="CRYPTO">CRYPTO</option>
      </select>
    </div>
    <div class="form-group"><label>مبلغ (تومان)</label><input class="form-control" id="ebAmt" value="5000000" oninput="ebCalc()"/></div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="document.getElementById('ebAmt').value=1000000;ebCalc()">۱M</button>
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="document.getElementById('ebAmt').value=5000000;ebCalc()">۵M</button>
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="document.getElementById('ebAmt').value=10000000;ebCalc()">۱۰M</button>
    </div>
    <div class="form-group"><label>دریافتی</label><input class="form-control" id="ebGet" readonly style="font-weight:700;color:var(--primary)"/></div>
    <button class="btn btn-primary" style="width:100%;padding:14px" onclick="toast('خرید ثبت شد')">پرداخت و خرید</button>
  </div>
</div>
<footer class="footer"><p style="font-size:0.75rem">کریپتوکارنسی</p></footer>
<div class="modal-bg" id="loginM"><div class="modal"><button class="modal-close" onclick="closeM('loginM')">×</button><h3>ورود</h3><div class="form-group"><label>موبایل</label><input class="form-control" id="lu"/></div><div class="form-group"><label>رمز</label><input type="password" class="form-control" id="lp"/></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="login()">ورود</button></div></div>
<div class="modal-bg" id="regM"><div class="modal"><button class="modal-close" onclick="closeM('regM')">×</button><h3>ثبت‌نام</h3><div class="form-group"><label>موبایل</label><input class="form-control" id="rm"/></div><div class="form-group"><label>رمز</label><input type="password" class="form-control" id="rp"/></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="reg()">ثبت‌نام</button></div></div>
<script src="app.js"></script>
<script>function ebCalc(){var sel=document.getElementById('ebCoin');var price=parseFloat(sel.value)||1;var amt=parseFloat(document.getElementById('ebAmt').value)||0;var sym=sel.options[sel.selectedIndex].getAttribute('data-s');document.getElementById('ebGet').value=(amt/price).toFixed(6)+' '+sym;}ebCalc();</script>
</body>
</html>
