<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>معاملات | کریپتوکارنسی</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%238B5CF6'/%3E%3Cstop offset='50%25' stop-color='%2300D4FF'/%3E%3Cstop offset='100%25' stop-color='%23D4AF37'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='%230B0E11'/%3E%3Cpath d='M75 25 A30 30 0 1 0 75 75' fill='none' stroke='url(%23g)' stroke-width='12' stroke-linecap='round'/%3E%3Cpath d='M70 20 L90 10 L80 35 Z' fill='%2300D4FF'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#D4AF37"/></linearGradient></defs><path d="M75 25 A30 30 0 1 0 75 75" fill="none" stroke="url(#lg)" stroke-width="12" stroke-linecap="round"/><path d="M70 20 L90 10 L80 35 Z" fill="#00D4FF"/></svg>
    کریپتوکارنسی
  </a>
  <nav class="nav">
    <a href="index.html">بازار</a>
    <a href="trade.html" class="active">معامله</a>
    <a href="margin.html">مارجین</a>
    <a href="easy-buy.html">خرید آسان</a>
    <a href="p2p.html">P2P</a>
    <a href="wallet.html">کیف پول</a>
    <a href="markets.html">همه بازارها</a>
  </nav>
  <div class="header-actions" id="authB">
    <button class="btn btn-outline btn-sm" onclick="openM('loginM')">ورود</button>
    <button class="btn btn-primary btn-sm" onclick="openM('regM')">ثبت‌نام</button>
  </div>
  <div class="header-actions" id="userI" style="display:none">
    <span style="color:var(--primary);font-weight:600;font-size:0.9rem" id="un"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
  </div>
</header>
<div class="container" style="max-width:1400px">
  <div class="pair-bar">
    <div class="pair-name">BTC / تومان</div>
    <div class="pair-price">6,840,000,000</div>
    <div class="pair-change up">+2.4%</div>
    <div style="color:var(--muted);font-size:0.85rem">حجم ۲۴س: ۱,۲۴۰ میلیارد</div>
    <select class="form-control" style="width:auto;min-width:140px;margin-right:auto" onchange="document.querySelector('.pair-name').textContent=this.value">
      <option>BTC / تومان</option><option>ETH / تومان</option><option>SOL / تومان</option><option>CRYPTO / تومان</option>
    </select>
  </div>
  <div class="trade-layout">
    <div>
      <div class="chart-area" style="margin-bottom:16px">
        <div class="chart-placeholder">
          <div style="font-weight:700;margin-bottom:8px;color:var(--text)">نمودار قیمت BTC</div>
          <div class="chart-bars" id="chartBars"></div>
          <div style="font-size:0.8rem">نمودار زنده</div>
        </div>
      </div>
      <div class="card" style="padding:16px">
        <div style="font-weight:700;margin-bottom:12px;font-size:0.9rem">عمق بازار</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div><div style="color:var(--red);font-size:0.8rem;margin-bottom:8px;font-weight:600">فروش</div><div class="depth-list" id="asks"></div></div>
          <div><div style="color:var(--green);font-size:0.8rem;margin-bottom:8px;font-weight:600">خرید</div><div class="depth-list" id="bids"></div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab active-buy" id="tabBuy" onclick="setSide('buy')">خرید</button>
        <button class="tab" id="tabSell" onclick="setSide('sell')">فروش</button>
      </div>
      <div class="form-group"><label>نوع سفارش</label>
        <select class="form-control"><option>Market</option><option>Limit</option><option>Stop-Limit</option><option>OCO</option></select>
      </div>
      <div class="form-group"><label>قیمت</label><input class="form-control" id="ordPrice" value="6840000000"/></div>
      <div class="form-group"><label>مقدار</label><input class="form-control" id="ordAmount" value="0.01" oninput="calcTotal()"/></div>
      <div class="form-group"><label>جمع</label><input class="form-control" id="ordTotal" value="68,400,000" readonly style="opacity:.8"/></div>
      <button class="btn btn-green" id="submitBtn" style="width:100%;padding:14px" onclick="submitOrder()">خرید BTC</button>
    </div>
  </div>
</div>
<footer class="footer"><p style="font-size:0.75rem">کریپتوکارنسی</p></footer>
<div class="modal-bg" id="loginM"><div class="modal"><button class="modal-close" onclick="closeM('loginM')">×</button><h3>ورود</h3><div class="form-group"><label>موبایل</label><input class="form-control" id="lu"/></div><div class="form-group"><label>رمز</label><input type="password" class="form-control" id="lp"/></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="login()">ورود</button></div></div>
<div class="modal-bg" id="regM"><div class="modal"><button class="modal-close" onclick="closeM('regM')">×</button><h3>ثبت‌نام</h3><div class="form-group"><label>موبایل</label><input class="form-control" id="rm"/></div><div class="form-group"><label>رمز</label><input type="password" class="form-control" id="rp"/></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="reg()">ثبت‌نام</button></div></div>
<script src="app.js"></script>
<script>
(function(){
  var side='buy';
  var bars=document.getElementById('chartBars');
  if(bars){var h='';for(var i=0;i<48;i++){var ht=30+Math.abs(Math.sin(i*0.4)*50)+Math.random()*40;h+='<span style="height:'+ht+'%"></span>';}bars.innerHTML=h;}
  function fillDepth(){
    var asks='',bids='',base=6840000000;
    for(var i=5;i>=1;i--){asks+='<div class="depth-row ask"><span>'+(base+i*1500000).toLocaleString()+'</span><span>'+(Math.random()*0.8+0.1).toFixed(3)+'</span></div>';}
    for(var i=1;i<=5;i++){bids+='<div class="depth-row bid"><span>'+(base-i*1200000).toLocaleString()+'</span><span>'+(Math.random()*0.8+0.1).toFixed(3)+'</span></div>';}
    var a=document.getElementById('asks'),b=document.getElementById('bids');
    if(a)a.innerHTML=asks;if(b)b.innerHTML=bids;
  }
  fillDepth();setInterval(fillDepth,4000);
  window.setSide=function(s){
    side=s;
    document.getElementById('tabBuy').className=s==='buy'?'tab active-buy':'tab';
    document.getElementById('tabSell').className=s==='sell'?'tab active-sell':'tab';
    var btn=document.getElementById('submitBtn');
    if(s==='buy'){btn.className='btn btn-green';btn.style.cssText='width:100%;padding:14px';btn.textContent='خرید BTC';}
    else{btn.className='btn btn-red';btn.style.cssText='width:100%;padding:14px';btn.textContent='فروش BTC';}
  };
  window.calcTotal=function(){
    var amt=parseFloat(document.getElementById('ordAmount').value)||0;
    var price=parseFloat(String(document.getElementById('ordPrice').value).replace(/,/g,''))||0;
    document.getElementById('ordTotal').value=(amt*price).toLocaleString();
  };
  window.submitOrder=function(){if(typeof toast==='function')toast(side==='buy'?'سفارش خرید ثبت شد':'سفارش فروش ثبت شد');};
})();
</script>
</body>
</html>
